<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Shore Cover Studio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="fonts/ArchivoBlack-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/Anton-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/BebasNeue-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/Pacifico-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <meta name="theme-color" content="#0a0a0f">
</head>
<body>
  <header class="app-header">
    <h1>Neon Shore Cover Studio</h1>
    <p class="tagline">GTA 6-style cover art maker</p>
  </header>

  <main class="app-main">
    <section class="editor-panel">
      <div class="toolbar">
        <div class="toolbar-group">
          <label for="file-input" class="btn btn-primary">Load Photo</label>
          <input type="file" id="file-input" accept="image/*" multiple hidden>
        </div>
        <div class="toolbar-group samples-group">
          <span class="label">Samples:</span>
          <div id="sample-buttons"></div>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="main-canvas" width="800" height="600"></canvas>
      </div>

      <div class="controls">
        <div class="control-row">
          <div class="control-group">
            <label for="layout-select">Layout</label>
            <select id="layout-select"></select>
          </div>
          <div class="control-group">
            <label for="grade-select">Grade</label>
            <select id="grade-select"></select>
          </div>
          <div class="control-group">
            <label for="font-select">Font</label>
            <select id="font-select"></select>
          </div>
        </div>

        <div class="control-row">
          <div class="control-group">
            <label for="caption-input">Caption</label>
            <input type="text" id="caption-input" placeholder="NEON SHORE" maxlength="32">
          </div>
          <div class="control-group">
            <label for="subtitle-input">Subtitle</label>
            <input type="text" id="subtitle-input" placeholder="Grand Theft Auto VI Style" maxlength="48">
          </div>
        </div>

        <div class="control-row panels-row">
          <div class="control-group">
            <label>Panels</label>
            <div id="panels-list"></div>
          </div>
          <div class="control-group zoom-group">
            <label>Zoom <span id="zoom-value">1.00x</span></label>
            <input type="range" id="zoom-slider" min="0.5" max="5" step="0.05" value="1">
          </div>
        </div>
      </div>
    </section>

    <aside class="export-panel">
      <h2>Export</h2>
      <div id="export-buttons">
        <button type="button" id="export-0" class="btn btn-export">Square (1080×1080)</button>
        <button type="button" id="export-1" class="btn btn-export">Portrait (1080×1350)</button>
        <button type="button" id="export-2" class="btn btn-export">Landscape (1920×1080)</button>
      </div>
      <button type="button" id="randomize-btn" class="btn btn-random">Randomize</button>
      
      <div class="preview-section">
        <h3>Preview</h3>
        <canvas id="preview-canvas" width="200" height="200"></canvas>
      </div>
    </aside>
  </main>

  <footer class="app-footer">
    <p>Neon Shore Cover Studio — Built for make.fun gta6-cover-art-01</p>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
