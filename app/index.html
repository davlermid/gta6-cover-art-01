<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Shore Cover Studio</title>
  <meta name="description" content="Create GTA-style cover art with neon color grades, custom layouts, and Archivo Black lettering">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="fonts/ArchivoBlack-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/Anton-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/BebasNeue-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="fonts/Pacifico-Regular.ttf" as="font" type="font/ttf" crossorigin>
</head>
<body>
  <header class="toolbar">
    <h1>Neon Shore Cover Studio</h1>
    <div class="toolbar-actions">
      <button id="btn-random" title="Randomize everything">Randomize</button>
    </div>
  </header>

  <main class="workspace">
    <section class="editor-pane">
      <div class="canvas-wrap">
        <canvas id="canvas" width="1080" height="1080"></canvas>
        <div class="canvas-overlay" id="canvas-overlay"></div>
      </div>
      <div class="controls">
        <div class="control-group">
          <label>Photo</label>
          <div class="photo-picker">
            <input type="file" id="photo-input" accept="image/*" title="Load your own photo">
            <select id="sample-picker">
              <option value="">— Built-in samples —</option>
              <option value="samples/boulevard.jpg">Boulevard</option>
              <option value="samples/pier.jpg">Pier</option>
            </select>
          </div>
        </div>

        <div class="control-group">
          <label>Layout</label>
          <select id="layout-picker"></select>
        </div>

        <div class="control-group">
          <label>Color Grade</label>
          <select id="grade-picker"></select>
        </div>

        <div class="control-group">
          <label>Caption</label>
          <input type="text" id="caption-input" placeholder="Main title" value="Vice City Nights">
        </div>

        <div class="control-group">
          <label>Subtitle</label>
          <input type="text" id="subtitle-input" placeholder="Neon glow subtitle" value="Neon Shore">
        </div>

        <div class="control-group">
          <label>Font</label>
          <select id="font-picker"></select>
        </div>

        <div class="control-group">
          <label>Zoom</label>
          <input type="range" id="zoom-slider" min="1" max="3" step="0.05" value="1">
          <span id="zoom-value">1.00×</span>
        </div>

        <div class="control-group">
          <label>Pan</label>
          <div class="pan-indicator" id="pan-indicator">Drag on canvas to pan</div>
        </div>

        <div class="export-group">
          <button id="export-1080" data-w="1080" data-h="1080">Export 1080×1080</button>
          <button id="export-1350" data-w="1080" data-h="1350">Export 1080×1350</button>
          <button id="export-1920" data-w="1920" data-h="1080">Export 1920×1080</button>
        </div>
      </div>
    </section>

    <aside class="preview-pane" id="preview-pane">
      <h2>Preview</h2>
      <div class="preview-wrap">
        <canvas id="preview-canvas" width="360" height="360"></canvas>
      </div>
      <p class="preview-hint">Preview updates live as you edit</p>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="status-text">Ready — load a photo to begin</span>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
