<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create GTA 6-style cover art with neon color grades, custom layouts, and Archivo Black lettering">
  <title>Neon Shore Cover Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Neon Shore Cover Studio</h1>
      <p class="tagline">GTA 6-style cover art maker</p>
    </header>

    <main>
      <section class="canvas-area">
        <canvas id="preview" width="1080" height="1080"></canvas>
        <div class="canvas-overlay" id="overlay"></div>
      </section>

      <aside class="controls">
        <div class="control-group">
          <label>Photos</label>
          <input type="file" id="photoInput" accept="image/*" multiple>
          <div class="sample-buttons">
            <button type="button" data-sample="boulevard.jpg">Boulevard</button>
            <button type="button" data-sample="pier.jpg">Pier</button>
          </div>
          <div class="photo-strip" id="photoStrip"></div>
        </div>

        <div class="control-group">
          <label>Layout</label>
          <select id="layoutSelect"></select>
        </div>

        <div class="control-group">
          <label>Color Grade</label>
          <select id="gradeSelect"></select>
        </div>

        <div class="control-group">
          <label>Caption</label>
          <input type="text" id="captionInput" placeholder="Main title">
          <input type="text" id="subtitleInput" placeholder="Subtitle (optional)">
        </div>

        <div class="control-group">
          <label>Font</label>
          <select id="fontSelect">
            <option value="ArchivoBlack">Archivo Black</option>
            <option value="Anton">Anton</option>
            <option value="BebasNeue">Bebas Neue</option>
            <option value="Pacifico">Pacifico</option>
          </select>
        </div>

        <div class="control-group">
          <label>Zoom / Pan</label>
          <input type="range" id="zoomSlider" min="1" max="3" step="0.05" value="1">
          <p class="hint">Drag on canvas to pan. Wheel to zoom.</p>
        </div>

        <div class="control-group exports">
          <label>Export</label>
          <button id="exportSquare">1080×1080</button>
          <button id="exportPortrait">1080×1350</button>
          <button id="exportLandscape">1920×1080</button>
        </div>

        <div class="control-group">
          <button id="randomizeBtn" class="randomize">Randomize</button>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
